name: Deploy PWA
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      # Dữ liệu cảnh báo do quy trình riêng (data.yml) lấy hằng đêm và lưu lại; ở đây chỉ dùng lại bản mới nhất.
      - name: Khôi phục dữ liệu đã lưu
        uses: actions/cache/restore@v4
        with:
          path: public/data
          key: osm-data-none
          restore-keys: osm-data-
      - name: Khôi phục bản đồ offline đã dựng
        uses: actions/cache/restore@v4
        with:
          path: public/map
          key: map-none
          restore-keys: map-
      - run: npm run build
      - name: Kiểm tra bản đăng (có dữ liệu, dưới giới hạn 1 GB của Pages)
        run: |
          test -s dist/data/version.json || { echo "::error::Thiếu dữ liệu cảnh báo (dist/data/version.json)"; exit 1; }
          SIZE=$(du -sm --apparent-size dist | cut -f1) # dung lượng thật (không tính khối đĩa của 170 nghìn tệp nhỏ)
          echo "Dung lượng: ${SIZE} MB"
          [ "$SIZE" -lt 900 ] || { echo "::error::Bản đăng ${SIZE} MB vượt 900 MB"; exit 1; }
      - uses: actions/upload-pages-artifact@v3
        with: { path: dist }
      - id: deploy
        uses: actions/deploy-pages@v4
