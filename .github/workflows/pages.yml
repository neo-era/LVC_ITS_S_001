name: Deploy PWA
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '30 19 * * *' # 02:30 giờ Việt Nam hằng đêm
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Khôi phục dữ liệu đã lưu
        id: cache
        uses: actions/cache/restore@v4
        with:
          path: public/data
          key: osm-data-${{ github.run_id }}
          restore-keys: osm-data-
      - name: Lấy dữ liệu cảnh báo từ OpenStreetMap
        id: data
        # Chỉ lấy mới vào ban đêm / khi chạy tay / khi chưa có bản lưu. Các lần đẩy code dùng lại bản đã lưu (nhanh).
        if: github.event_name != 'push' || steps.cache.outputs.cache-matched-key == ''
        # Đêm: lỗi thì dừng để giữ bản đang chạy. Lúc đẩy code: lỗi vẫn triển khai (app chạy không có dữ liệu).
        continue-on-error: ${{ github.event_name != 'schedule' }}
        env:
          MARKS_URL: ${{ secrets.MARKS_URL }}
        run: npm run data
      - name: Lưu dữ liệu cho các lần sau
        if: steps.data.outcome == 'success'
        uses: actions/cache/save@v4
        with:
          path: public/data
          key: osm-data-${{ github.run_id }}
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with: { path: dist }
      - id: deploy
        uses: actions/deploy-pages@v4
