name: Lấy dữ liệu cảnh báo
on:
  schedule:
    - cron: '30 19 * * *' # 02:30 giờ Việt Nam hằng đêm
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - tools/build-data.ts
      - src/pipeline/**
      - src/core/cells.ts
      - .github/workflows/data.yml
      - tools/inspect-areas.json
      - tools/inspect.ts
permissions:
  contents: read
  actions: write # để gọi lại quy trình đăng trang sau khi có dữ liệu mới
concurrency:
  group: data
  cancel-in-progress: true
jobs:
  # Gọi máy chủ Supabase mỗi đêm để dự án gói miễn phí không bị tự tạm dừng (sau 7 ngày không dùng).
  keepalive:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with: { sparse-checkout: src/sync.ts, sparse-checkout-cone-mode: false }
      - name: Gọi lat_health
        continue-on-error: true
        run: |
          KEY=$(grep -oE "eyJ[A-Za-z0-9._-]+" src/sync.ts | head -1)
          URL=$(grep -oE "https://[a-z0-9]+\.supabase\.co" src/sync.ts | head -1)
          R=$(curl -sS -m 30 -X POST "$URL/rest/v1/rpc/lat_health" -H "apikey: $KEY" -H "authorization: Bearer $KEY" -H 'content-type: application/json' -d '{}' || true)
          echo "$R"
          echo "$R" | grep -q '"ok": *true' || echo "::warning::Máy chủ Supabase chưa sẵn sàng: $R"
  data:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Cài osmium
        run: sudo apt-get update -qq && sudo apt-get install -y -qq osmium-tool
      - name: Tải bản trích OpenStreetMap Việt Nam (Geofabrik, cập nhật hằng ngày)
        run: curl -fsSL --retry 3 -o vn.osm.pbf https://download.geofabrik.de/asia/vietnam-latest.osm.pbf && ls -lh vn.osm.pbf
      - name: Lọc đường và camera
        run: |
          osmium tags-filter vn.osm.pbf \
            w/highway=motorway,trunk,primary,secondary,tertiary,unclassified,residential,living_street,motorway_link,trunk_link,primary_link,secondary_link,tertiary_link \
            n/highway=speed_camera n/enforcement=maxspeed \
            n/place=city,town,village,suburb,quarter,neighbourhood,hamlet \
            -o roads.osm.pbf --overwrite
          osmium export roads.osm.pbf -f geojsonseq -a type,id --geometry-types=point,linestring,polygon -o roads.geojsonseq --overwrite
          ls -lh roads.osm.pbf roads.geojsonseq
      - name: Tạo ô dữ liệu toàn quốc + dấu camera đã duyệt
        env:
          GEOJSONSEQ: roads.geojsonseq
          NODE_OPTIONS: --max-old-space-size=12288
        run: npm run data
      - name: Soi dữ liệu vùng cần kiểm tra (tools/inspect-areas.json)
        if: hashFiles('tools/inspect-areas.json') != ''
        continue-on-error: true
        env:
          GEOJSONSEQ: roads.geojsonseq
        run: npx tsx tools/inspect.ts
      - name: Lưu dữ liệu cho các lần đăng trang
        uses: actions/cache/save@v4
        with:
          path: public/data
          key: osm-data-${{ github.run_id }}
      - name: Đăng lại trang với dữ liệu mới
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --ref main
